openai:
  api_key_env: OPENAI_API_KEY
  api_key: ""
  base_url: "https://api.v3.cm/v1"
  timeout_sec: 180

image_edit:
  model: gpt-image-2
  size: original
  api_size: 1536x1024
  quality: high
  response_format: b64_json
  mask_mode: prompt_only
  mask_frame_mode: reference_frame
  use_full_image_output: true
  mask_expand_px: 8
  prompt: |-
    Edit the input image minimally. Keep the scene as close as possible to the original frame.

    Generate a clean background for a tabletop robotic manipulation scene.

    Remove all active foreground manipulation objects from the work surface: cups, bowls, bottles, cylinders, blocks, packages, tools, loose objects, round objects, and robot gripper or arm parts that occlude the tabletop. The tabletop/work surface should be visible where these objects were.

    Preserve the static scene as much as possible: exact camera perspective, tabletop boundaries, wood grain, table edge context, background fixtures, lighting, reflections, soft shadows, stains, scratches, seams, and natural texture. The result should still feel like the same real robotic workbench scene, only with movable foreground objects gently removed.

    Avoid over-cleaning, avoid making the tabletop pristine, avoid replacing the environment, avoid inventing a new table, and avoid changing geometry or style.
