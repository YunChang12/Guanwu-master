openai:
  api_key_env: OPENAI_API_KEY
  api_key: ""
  base_url: "https://api.v3.cm/v1"
  timeout_sec: 180

image_edit:
  model: gpt-image-2
  size: original
  api_size: 1536x1024
  quality: high
  response_format: b64_json
  mask_mode: prompt_only
  mask_frame_mode: reference_frame
  use_full_image_output: true
  mask_expand_px: 8
  prompt: |-
    Edit the input image minimally. Keep the scene as close as possible to the original frame.

    Remove only the active manipulation objects on the central wooden board: the target wooden block, loose small blocks, and robot parts that directly occlude the board. Preserve everything else unless it clearly covers the central board surface.

    Maintain the exact camera perspective, wood board boundaries, metal grooved table, edge context, lighting, reflections, shadows, stains, scratches, seams, and natural texture. The result should still feel like the same robotic workbench scene, only with the active objects gently removed.

    Avoid over-cleaning, avoid replacing the environment, avoid making the tabletop pristine, and avoid changing geometry or style.
